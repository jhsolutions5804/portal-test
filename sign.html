<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>계약서 서명 | JH Solutions</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:#F4F7FB;color:#1A2540;min-height:100vh;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
  .hdr{text-align:center;padding:20px 0 10px;}
  .hdr .logo{font-weight:900;color:#1D5BA6;font-size:1.05rem;margin-bottom:4px;}
  .hdr h1{font-size:1.15rem;font-weight:800;}
  .card{background:#fff;border-radius:14px;border:1px solid #DDE4EF;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,0.05);}
  .muted{color:#9AAABF;font-size:0.8rem;line-height:1.6;}
  .doc-frame-wrap{background:#888;border-radius:12px;overflow:hidden;margin-bottom:14px;}
  iframe#docFrame{width:100%;height:60vh;border:none;display:block;background:#888;}
  .agree-box{display:flex;gap:8px;align-items:flex-start;background:#EAF3FD;border-radius:10px;padding:12px 14px;font-size:0.82rem;color:#1A2540;line-height:1.6;margin-bottom:14px;}
  .agree-box input{width:17px;height:17px;margin-top:2px;flex-shrink:0;}
  canvas#signPad{width:100%;height:160px;border:2px dashed #B5D4F4;border-radius:12px;background:#FAFCFF;touch-action:none;}
  .sign-tools{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px;}
  .btn{padding:13px;border-radius:10px;font-weight:700;font-size:0.9rem;border:none;cursor:pointer;width:100%;}
  .btn-primary{background:#1D5BA6;color:#fff;}
  .btn-primary:disabled{background:#B9C6D6;cursor:not-allowed;}
  .btn-ghost{background:#fff;border:1px solid #DDE4EF;color:#5C6F8A;}
  .center{text-align:center;}
  .state-icon{font-size:2.4rem;margin-bottom:10px;}
  .warn{background:#FFF4E5;border:1px solid #F4D9AD;color:#9A5B00;border-radius:10px;padding:11px 13px;font-size:0.78rem;line-height:1.6;margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="logo">JH Solutions</div>
    <h1>계약서 원격 서명</h1>
  </div>
  <div id="app"><div class="card center muted">⏳ 불러오는 중...</div></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyDwkKOrRU1LF_N7fiVNWc5CRp-abopSyrI",
  authDomain: "portal-test-6e0ff.firebaseapp.com",
  projectId: "portal-test-6e0ff",
  storageBucket: "portal-test-6e0ff.appspot.com",
  messagingSenderId: "752763010816",
  appId: "1:752763010816:web:4a0c7062a2f1a4e9a03de5"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const el = document.getElementById('app');

const params = new URLSearchParams(location.search);
const token = params.get('token');

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function maskJumin(j){
  if (!j) return '';
  const digits = j.replace(/\D/g,'');
  if (digits.length < 7) return j;
  const front = digits.slice(0,6), sex = digits.slice(6,7);
  return `${front}-${sex}${'●'.repeat(Math.max(digits.length-7,6))}`;
}

function showError(msg){
  el.innerHTML = `<div class="card center">
    <div class="state-icon">⚠️</div>
    <div style="font-weight:700;margin-bottom:6px;">${esc(msg)}</div>
    <div class="muted">링크를 다시 확인하시거나, 회사(인사담당자)에게 문의해 주세요.</div>
  </div>`;
}

if (!token) {
  showError('잘못된 접근입니다. 링크에 서명 토큰이 없습니다.');
} else {
  boot();
}

async function boot(){
  try {
    const linkSnap = await getDoc(doc(db,'sign_links',token));
    if (!linkSnap.exists()) { showError('유효하지 않은 서명 링크입니다.'); return; }
    const link = linkSnap.data();

    if (link.status === 'signed') {
      el.innerHTML = `<div class="card center">
        <div class="state-icon">✅</div>
        <div style="font-weight:700;margin-bottom:6px;">이미 서명이 완료된 문서입니다</div>
        <div class="muted">추가 서명이 필요하시면 회사(인사담당자)에게 문의해 주세요.</div>
      </div>`;
      return;
    }
    if (link.expiresAt && new Date(link.expiresAt).getTime() < Date.now()) {
      showError('서명 링크가 만료되었습니다 (72시간 경과).');
      return;
    }

    const collName = link.docType === 'annual' ? 'annual_contracts' : 'labor_contracts';
    const contractRef = doc(db, `${collName}/${link.workerId}/contracts`, link.contractId);
    const cSnap = await getDoc(contractRef);
    if (!cSnap.exists()) { showError('계약서 정보를 찾을 수 없습니다.'); return; }
    const f = { ...cSnap.data() };

    // 공개 페이지 노출용: 주민등록번호 뒷자리 마스킹
    const fMasked = { ...f, jumin: maskJumin(f.jumin) };

    // 회사 서명(도장) 로드 (있으면 미리보기에 반영)
    let compSig = {};
    try {
      const cs = await getDoc(doc(db,'company_settings','signatures'));
      if (cs.exists()) compSig = cs.data();
    } catch(e) {}
    window._compSignatures = compSig;

    const docTitle = link.docType === 'annual' ? '연봉계약서' : '근로계약서';
    showPhoneVerify(f, link, contractRef, docTitle, fMasked);
  } catch(e) {
    showError('오류가 발생했습니다: ' + e.message);
  }
}

function normalizePhoneE164(phone){
  const digits = String(phone||'').replace(/\D/g,'');
  // 한국 휴대폰번호(010...) 가정 → +82 국제표준으로 변환
  const local = digits.replace(/^0/, '');
  return '+82' + local;
}

function showPhoneVerify(f, link, contractRef, docTitle, fMasked){
  const phoneDigits = String(f.phone||'').replace(/\D/g,'');
  const maskedPhone = phoneDigits.length >= 8
    ? phoneDigits.slice(0,3) + '-****-' + phoneDigits.slice(-4)
    : (f.phone || '(등록된 연락처 없음)');

  el.innerHTML = `
    <div class="card">
      <div style="font-weight:800;font-size:0.98rem;margin-bottom:4px;">${esc(f.name)}님, 안녕하세요</div>
      <div class="muted">본인 확인을 위해 근로자 명부에 등록된 휴대폰 번호로 인증번호를 보내드립니다.</div>
    </div>
    <div class="card center">
      <div style="font-size:1.3rem;font-weight:800;letter-spacing:1px;margin-bottom:14px;">${esc(maskedPhone)}</div>
      <div id="recaptcha-container"></div>
      <button class="btn btn-primary" id="sendCodeBtn">📩 이 번호로 인증번호 받기</button>
      <div id="phoneStep2" style="display:none;margin-top:14px;">
        <input type="tel" id="otpInput" placeholder="인증번호 6자리" maxlength="6" style="width:100%;padding:12px;border:1px solid #DDE4EF;border-radius:10px;font-size:1.1rem;text-align:center;letter-spacing:4px;margin-bottom:10px;">
        <button class="btn btn-primary" id="verifyCodeBtn">확인</button>
        <div id="otpMsg" class="muted" style="margin-top:8px;"></div>
      </div>
    </div>
    <div class="warn">⚠️ 등록된 번호가 본인 것이 아니거나 변경되었다면, 계약서 확인 전에 회사(인사담당자)에게 먼저 연락해 번호를 갱신해 주세요.</div>
  `;

  if (!phoneDigits) {
    document.querySelector('.card.center').innerHTML = `<div class="state-icon">⚠️</div><div style="font-weight:700;">등록된 연락처가 없어 본인확인을 진행할 수 없습니다.<br>회사(인사담당자)에게 문의해 주세요.</div>`;
    return;
  }

  const verifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });
  let confirmationResult = null;

  document.getElementById('sendCodeBtn').onclick = async () => {
    const btn = document.getElementById('sendCodeBtn');
    btn.disabled = true; btn.textContent = '전송 중...';
    try {
      const e164 = normalizePhoneE164(f.phone);
      confirmationResult = await signInWithPhoneNumber(auth, e164, verifier);
      btn.textContent = '✅ 전송 완료 (재전송하려면 새로고침)';
      document.getElementById('phoneStep2').style.display = 'block';
    } catch(e) {
      btn.disabled = false; btn.textContent = '📩 이 번호로 인증번호 받기';
      document.getElementById('otpMsg').textContent = '전송 실패: ' + e.message;
    }
  };

  document.getElementById('verifyCodeBtn').onclick = async () => {
    const code = document.getElementById('otpInput').value.trim();
    if (!code) return;
    const vBtn = document.getElementById('verifyCodeBtn');
    vBtn.disabled = true; vBtn.textContent = '확인 중...';
    try {
      await confirmationResult.confirm(code);
      showContractAndSign(f, link, contractRef, docTitle, fMasked);
    } catch(e) {
      vBtn.disabled = false; vBtn.textContent = '확인';
      document.getElementById('otpMsg').textContent = '인증번호가 올바르지 않습니다. 다시 확인해 주세요.';
    }
  };
}

async function showContractAndSign(f, link, contractRef, docTitle, fMasked){
  try {
    const previewHtml = link.docType === 'annual'
      ? __annualHtml_v5(fMasked)
      : __laborHtml_v5(fMasked);

    el.innerHTML = `
      <div class="card">
        <div style="font-weight:800;font-size:0.98rem;margin-bottom:4px;">${esc(f.name)}님, 안녕하세요</div>
        <div class="muted">아래 ${docTitle} 내용을 꼼꼼히 확인하신 뒤, 동의 체크와 서명을 완료해 주세요.</div>
      </div>
      <div class="doc-frame-wrap"><iframe id="docFrame" srcdoc="${previewHtml.replace(/"/g,'&quot;')}"></iframe></div>
      <div class="agree-box">
        <input type="checkbox" id="agreeChk">
        <label for="agreeChk">위 ${docTitle} 내용을 모두 확인하였으며, 이 계약에 동의합니다. 아래 전자서명은 본인이 직접 한 것이며, 서면 서명과 동일한 효력을 가짐에 동의합니다.</label>
      </div>
      <div class="card">
        <div style="font-weight:700;font-size:0.85rem;margin-bottom:8px;">✍️ 서명</div>
        <canvas id="signPad"></canvas>
        <div class="sign-tools">
          <button class="btn-ghost" id="clearBtn" style="width:auto;padding:8px 16px;font-size:0.8rem;">지우기</button>
          <span class="muted">손가락 또는 마우스로 서명해 주세요</span>
        </div>
        <button class="btn btn-primary" id="submitBtn" disabled>서명 완료</button>
      </div>
      <div class="warn">⚠️ 서명 후에는 이 계약서 내용을 임의로 수정할 수 없습니다. 서명 완료 즉시 회사 인사관리시스템에 자동 반영되며, 서명 시각과 접속 정보가 함께 기록됩니다.</div>
    `;

    // ── 서명 캔버스 ──
    const canvas = document.getElementById('signPad');
    const ctx = canvas.getContext('2d');
    function fitCanvas(){
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * 2; canvas.height = rect.height * 2;
      ctx.scale(2,2); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = '#1A2540';
    }
    fitCanvas();
    let drawing = false, hasSigned = false, lastX=0, lastY=0;
    function pos(e){
      const rect = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - rect.left, y: t.clientY - rect.top };
    }
    function start(e){ e.preventDefault(); drawing = true; const p = pos(e); lastX=p.x; lastY=p.y; }
    function move(e){
      if (!drawing) return; e.preventDefault();
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
      lastX=p.x; lastY=p.y; hasSigned = true;
      document.getElementById('submitBtn').disabled = !(hasSigned && document.getElementById('agreeChk').checked);
    }
    function end(){ drawing = false; }
    canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, {passive:false}); canvas.addEventListener('touchmove', move, {passive:false}); canvas.addEventListener('touchend', end);

    document.getElementById('clearBtn').onclick = () => {
      ctx.clearRect(0,0,canvas.width,canvas.height); hasSigned = false;
      document.getElementById('submitBtn').disabled = true;
    };
    document.getElementById('agreeChk').onchange = function(){
      document.getElementById('submitBtn').disabled = !(hasSigned && this.checked);
    };

    document.getElementById('submitBtn').onclick = async () => {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = '처리 중...';
      try {
        const signData = canvas.toDataURL('image/png');
        let ip = '';
        try {
          const r = await fetch('https://api.ipify.org?format=json');
          const j = await r.json(); ip = j.ip || '';
        } catch(e) {}
        await updateDoc(contractRef, {
          signData, remoteSigned: true, signedAt: new Date().toISOString(),
          signedIp: ip, signedUserAgent: navigator.userAgent,
        });
        await updateDoc(doc(db,'sign_links',token), { status:'signed', signedAt: serverTimestamp() });

        // 서명 반영된 최종본 (다운로드/보관용)
        const finalF = { ...f, jumin: maskJumin(f.jumin), signData };
        const finalHtml = link.docType === 'annual' ? __annualHtml_v5(finalF) : __laborHtml_v5(finalF);

        el.innerHTML = `<div class="card center">
          <div class="state-icon">✅</div>
          <div style="font-weight:800;font-size:1rem;margin-bottom:6px;">서명이 완료되었습니다</div>
          <div class="muted" style="margin-bottom:16px;">인사관리시스템에 자동으로 반영되었습니다. 아래 버튼으로 서명된 계약서를 확인·저장하실 수 있습니다.</div>
          <button class="btn btn-primary" id="viewFinalBtn">📄 서명된 계약서 보기 / 저장</button>
        </div>`;
        document.getElementById('viewFinalBtn').onclick = () => {
          const w = window.open('', '_blank');
          w.document.write(finalHtml); w.document.close();
        };
      } catch(e) {
        alert('서명 처리 중 오류가 발생했습니다: ' + e.message);
        btn.disabled = false; btn.textContent = '서명 완료';
      }
    };
  } catch(e) {
    showError('오류가 발생했습니다: ' + e.message);
  }
}

/* ══════════════════════════════════════════════
   아래 두 함수는 hr/index.html의 현재(v5) 계약서 템플릿을 그대로 복사한 것입니다.
   ⚠️ hr/index.html에서 DOC_TPL_CURRENT가 새 버전으로 올라가면, 이 파일도 함께 갱신해야
   신규로 생성되는 서명 링크의 미리보기가 최신 양식과 일치합니다.
   (이미 서명 완료되어 저장된 계약서 자체의 내용은 영향받지 않습니다 — 저장 서류 동결 원칙)
   ══════════════════════════════════════════════ */
function __calcAnnualSalary_v1(hourly, empType) {
  if (!hourly) return { basic:0, fixedOt:0, fixedNight:0, weekly:0, total:0, annual:0 };
  const h = Number(hourly);
  const basic      = Math.round(h * 8 * 5 * 4.345);
  const fixedOt    = 0;
  const fixedNight = 0;
  const weekly     = Math.round(h * 8 * 4.345);
  const total       = basic + fixedOt + fixedNight + weekly;
  return { basic, fixedOt, fixedNight, weekly, total, annual: total * 12 };
}

function __annualHtml_v5(f0){
  const f=f0; const sal=__calcAnnualSalary_v1(Number(f.hourly||0), f.empType||'field');
  const fmtDp=s=>{if(!s)return'____년 __월 __일';const d=new Date(s);return`${d.getFullYear()}년 ${String(d.getMonth()+1).padStart(2,'0')}월 ${String(d.getDate()).padStart(2,'0')}일`;};
  const ul=(v,w)=>`<span style="display:inline-block;min-width:${w||80}px;border-bottom:1px solid #333;text-align:center;padding:0 2px;">${v||''}</span>`;
  const tr=(l,a,b)=>`<tr><td style="border:1px solid #333;padding:5px 8px;font-size:10pt;">${l}</td><td style="border:1px solid #333;padding:5px 8px;text-align:right;font-size:10pt;">${a}</td><td style="border:1px solid #333;padding:5px 8px;font-size:9pt;color:#555;">${b}</td></tr>`;
  const w=v=>v?`₩${Number(v).toLocaleString()}`:'';
  const signImg=f.signData?`<img src="${f.signData}" style="width:100px;height:40px;object-fit:contain;opacity:0.9;vertical-align:middle;"/>`:`<span style="display:inline-block;width:100px;height:40px;border:1px dashed #ccc;vertical-align:middle;"></span>`;
  return (`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>연봉계약서 - ${f.name}</title>
    <style>body{margin:0;font-family:'Malgun Gothic',Arial,sans-serif;background:#888;display:flex;flex-direction:column;align-items:center;padding:20px;}.a4{width:210mm;min-height:297mm;background:#fff;padding:20mm 22mm;box-shadow:0 4px 24px rgba(0,0,0,.2);font-size:10.5pt;line-height:1.9;color:#1A2540;}@media print{body{background:#fff;padding:0;}.toolbar{display:none;}.a4{box-shadow:none;padding:15mm 20mm;width:100%;}}</style>
    </head><body>
    <div class="toolbar" style="margin-bottom:12px;display:flex;gap:8px;">
      <button onclick="window.close()" style="padding:8px 16px;background:#fff;border:1px solid #DDE4EF;border-radius:8px;cursor:pointer;">← 닫기</button>
      <button onclick="window.print()" style="padding:8px 16px;background:#1D5BA6;border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;">🖨 인쇄/PDF</button>
    </div>
    <div class="a4">
      <div style="text-align:center;margin-bottom:28px;"><div style="font-size:20pt;font-weight:800;letter-spacing:6px;">연 봉 계 약 서</div><div style="width:60px;height:2px;background:#333;margin:8px auto 0;"></div></div>
      <p style="margin-bottom:12px;">제이에이치솔루션 (이하"갑"이라 한다.)과 근로자 ${ul(f.name,100)} (이하 "을"이라 한다.)는 다음과 같은 조건으로 연봉계약을 체결하고, 이를 성실하게 준수할 것을 확인한다.</p>
      <p style="font-weight:700;margin:14px 0 5px;">제1조 (연봉계약기간)</p>
      <p style="margin-bottom:4px;">① 직원의 연봉계약기간은 ${fmtDp(f.startDate)} 부터 ${fmtDp(f.endDate)}까지(12개월)로 한다.</p>
      <p style="margin-bottom:4px;">② 연봉 계약 기간 중 회사규정에 따른 연봉의 증감 사유가 발생한 때에는 제1항의 계약 기간 중이라도 연봉을 조정할 수 있다.</p>
      <p style="margin-bottom:10px;">③ 근로 계약 해지 사유가 발생하여 근로계약이 종료되면 본 계약도 해지된 것으로 간주한다.</p>
      <p style="font-weight:700;margin:14px 0 5px;">제2조 (연봉의 구성)</p>
      <p style="margin-bottom:6px;">① 계약 연봉은 ${f.salary?`금 ${Number(f.salary).toLocaleString()}원`:'금 ____________원'}으로 한다.</p>

      <p style="margin-bottom:4px;">2. "을"은 신규 입사 시 즉시 채용신체검사서를 제출하여야 하며, 정기 건강진단을 관련법령에 의거 실시하고 "을"은 이에 반드시 응해야 한다.</p>
      <p style="margin-bottom:6px;">3. "을"은 제반 법규 및 "갑"이 정한 제반 안전 교육사항 및 안전수칙을 준수하여야 한다.</p>
      <p style="font-weight:700;margin:12px 0 4px;">제15조 【취업 전 고지】</p>
      <p style="margin-bottom:6px;">"을"은 본 근로계약의 내용을 취업 전 충분히 숙지하고 이를 성실히 이행한다.</p>
      <p style="font-weight:700;margin:12px 0 4px;">제16조 【근로조건의 결정】</p>
      <p style="margin-bottom:6px;">"을"은 본 근로계약의 내용에 이의를 제기하지 아니하며 "을"의 근로조건은 "갑"의 취업규칙 및 근로자계약 범위 내에서 결정되는 것에 동의한다.</p>
      <p style="font-weight:700;margin:12px 0 4px;">제17조 【계약의 해지】</p>
      <p style="margin-bottom:4px;">다음 각 호에 해당하는 경우 갑과 을의 근로계약은 해지된다.</p>
      <p style="margin-bottom:4px;">1. "갑"과 "을"의 상호 합의 하에 근무일을 지정하여 해당 날짜까지 근무 후 계약 종료</p>
      <p style="margin-bottom:4px;">2. "을"의 계약종료 의사를 "갑"이 인지한 시점으로부터 당기 후의 1기가 지난 뒤 해지의 효력이 발생</p>
      <p style="margin-bottom:6px;">3. 제11조 귀책사유 발생 시 "갑"은 일방적으로 "을"과의 근로계약을 해지할 수 있다.</p>
      <p style="font-weight:700;margin:12px 0 4px;">제18조 【지급품의 반납】</p>
      <p style="margin-bottom:6px;">퇴직 시에는 "을"은 "갑"으로부터 지급받은 장비, 피복, 기타 이에 준하는 지급품은 필히 반납하여야 하며 반납치 않을 시에는 급여에서 공제한다.</p>
      <p style="font-weight:700;margin:12px 0 4px;">제19조 【근로기준법의 적용】</p>
      <p style="margin-bottom:6px;">본 계약에 명시되지 않은 사항은 회사의 취업규칙 및 근로기준법의 해석에 준하여 따른다.</p>
      <p style="font-weight:700;margin:12px 0 4px;">제20조 【비밀유지】</p>
      <p style="margin-bottom:4px;">1. "을"은 자신의 계약내용을 관계인에게 누설하지 않는다.</p>
      <p style="margin-bottom:4px;">2. "을"은 근무지에서 발생하는 인사문제를 관리자에게 보고하여야 하며 조치 받을 수 있도록 한다.</p>
      <p style="margin-bottom:6px;">3. "을"은 "갑"에서 발생하는 문제를 외부에 누설하지 않는다.</p>
      <p style="font-weight:700;margin:12px 0 4px;">제21조 【계약의 유지】</p>
      <p style="margin-bottom:12px;">"갑"과 "을"은 제2조의 계약기간을 원칙으로 하며 "을"은 이에 동의한다. 위 계약내용이 당사자의 자유로운 의사에 의하여 원만히 체결되었음을 상호 확인하고 각 1통씩 보관한다.</p>
      <p style="font-weight:600;margin:20px 0 16px;">계약일자 : ${fmtDp(f.contractDate)}</p>

        <div style="border-top:1px solid #333;padding-top:12px;"><p style="font-weight:700;margin-bottom:6px;">(을)</p><p>주&nbsp;&nbsp;소 : ${ul(f.address,140)}</p><p>이&nbsp;&nbsp;름 : ${ul(f.name,80)}</p><p>주민등록번호 : ${ul(f.jumin,110)}</p><div style="margin-top:8px;display:flex;align-items:center;gap:8px;"><span>(인)</span>${signImg}</div></div>
