<!DOCTYPE html>
<!-- build: 20260728a · ver: 1.0.0 (모바일 월간 공수 신규) -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>월간 공수 · JH Solutions</title>
<style>
  :root{--blue:#1D5BA6;--blue-d:#16487f;--ink:#1a2330;--sub:#6b7787;--line:#e4eaf2;--bg:#eef2f7;--card:#fff;--ok:#1b8a5a;--warn:#c0392b;--amber:#e08a1e;--violet:#7C3AED}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Apple SD Gothic Neo','Pretendard',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
  .phone{width:100%;max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh}
  .scr{padding:0 0 30px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 4px}
  .back{background:var(--card);border:1px solid var(--line);color:var(--blue);font-size:13px;font-weight:700;padding:8px 14px;border-radius:12px;cursor:pointer;font-family:inherit;box-shadow:0 2px 6px rgba(30,50,80,.05)}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;box-shadow:0 4px 10px rgba(124,58,237,.3)}
  .hello{padding:18px 24px 6px}
  .hello .name{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .hello .sub{font-size:12.5px;color:var(--sub);margin-top:4px;font-weight:600}
  .month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 20px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .month-arrow{background:#f0f4f9;border:1px solid var(--line);border-radius:9px;width:34px;height:34px;font-size:16px;color:#5c6f8a;cursor:pointer}
  .month-label{font-size:16px;font-weight:800;color:var(--blue-d);min-width:100px;text-align:center}
  .lbl{font-size:12px;font-weight:800;color:#9aa8bc;letter-spacing:.5px;padding:20px 24px 10px}
  .sum-row{display:flex;gap:8px;margin:0 20px}
  .sum-card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .sum-card .k{font-size:10.5px;color:var(--sub);font-weight:700}
  .sum-card .v{font-size:17px;font-weight:800;margin-top:3px;color:var(--violet)}
  .list{padding:0 20px;display:flex;flex-direction:column;gap:10px}
  .pjt-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .pjt-row .nm{font-size:13.5px;font-weight:700}
  .pjt-row .wc{font-size:11px;color:var(--sub);margin-top:2px}
  .pjt-row .tot{font-size:15px;font-weight:800;color:var(--blue)}
  .team-block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .team-head{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13.5px;margin-bottom:8px}
  .team-head .tot{color:var(--violet)}
  .team-amt{font-size:11px;color:var(--sub);font-weight:600;margin-top:2px}
  .team-member{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;padding:6px 0;border-top:1px solid #f2f5f9}
  .person-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .person-row .top-r{display:flex;align-items:center;justify-content:space-between}
  .person-row .nm{font-size:13.5px;font-weight:700}
  .person-row .birth{font-size:10.5px;color:#9aa8bc;font-weight:600;margin-left:4px}
  .person-row .warn{font-size:10.5px;color:var(--amber);font-weight:700;margin-left:4px}
  .person-row .tot{font-size:14.5px;font-weight:800;color:var(--blue)}
  .badges{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
  .pjt-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:#f0f4f9;color:#5c6f8a}
  .empty{margin:8px 20px 0;padding:18px;text-align:center;color:#9aa8bc;font-size:12.5px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:14px}
  .loading{text-align:center;padding:60px 20px;color:#9aa8bc;font-size:13px;font-weight:600}
  .denied{margin:40px 20px 0;padding:26px 20px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px}
  .denied .ic{font-size:34px;margin-bottom:10px}
  .denied .t{font-size:15px;font-weight:800;margin-bottom:6px}
  .denied .s{font-size:12.5px;color:var(--sub);line-height:1.6}
  .warn-box{margin:12px 20px 0;padding:12px 14px;background:#fff8e8;border:1px solid #ffe082;border-radius:12px;font-size:11.5px;color:#7a5c00;line-height:1.6}
</style>
<script src="auth-guard.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <div class="phone"><div id="app" class="scr"><div class="loading">불러오는 중…</div></div></div>

<script type="module">
const _uInitial=(function(){try{var a=JSON.parse(localStorage.getItem('jh_login_perms')||'null');return (a&&a.name)?a.name.slice(0,1):'·';}catch(e){return '·';}})();
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, getDoc, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
const firebaseConfig = {
  apiKey:"AIzaSyDwkKOrRU1LF_N7fiVNWc5CRp-abopSyrI", authDomain:"portal-test-6e0ff.firebaseapp.com",
  projectId:"portal-test-6e0ff", storageBucket:"portal-test-6e0ff.firebasestorage.app",
  messagingSenderId:"752763010816", appId:"1:752763010816:web:4a0c7062a2f1a4e9a03de5"
};
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app);
const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $app=()=>document.getElementById('app');
const pad=n=>String(n).padStart(2,'0');
function fmtMoney(n){ return (n||0).toLocaleString('ko-KR'); }

function topBar(label){ return `<div class="top"><button class="back" onclick="goHome()">← ${label}</button><div class="avatar" onclick="goAccount()">${_uInitial}</div></div>`; }
window.goHome=function(){ location.href='home.html'; };
window.goAccount=function(){ location.href='account.html'; };

function showDenied(msg){
  $app().innerHTML = topBar('월간 공수') + `
    <div class="denied"><div class="ic">🔒</div><div class="t">접근할 수 없습니다</div><div class="s">${esc(msg)}</div></div>`;
}

let curY, curM;
(function(){ const n=new Date(); curY=n.getFullYear(); curM=n.getMonth(); })();
window.mShift=function(dir){
  curM+=dir; if(curM>11){curM=0;curY++;} if(curM<0){curM=11;curY--;}
  loadMonth();
};

async function loadRoster(collPath, sourceLabel, masterMap){
  try{
    const snap=await getDocs(collection(db, ...collPath));
    const list=[];
    snap.forEach(d=>{
      const w=d.data(); const m=masterMap[d.id];
      list.push({ id:d.id, name:(m&&m.name)||w.name||'(이름없음)', birth:(m&&m.birth)||w.birth||'', sourceLabel });
    });
    return list;
  }catch(e){ return []; }
}

let _lastPersonMap={}, _masterList=[], _personList=[], _lastPjtTotals={};

async function loadMonth(){
  $app().innerHTML = topBar('월간 공수') + `<div class="loading">${curY}년 ${curM+1}월 데이터 불러오는 중…</div>`;
  const daysInMonth=new Date(curY,curM+1,0).getDate();
  const dateKeys=[]; for(let d=1; d<=daysInMonth; d++) dateKeys.push(`${curY}-${pad(curM+1)}-${pad(d)}`);

  // 1. 활성 PJT 목록: FAB/SUP 고정 + pjt_registry 활성 항목
  const projects=[{key:'p4ph2',name:'P4 Ph2 (FAB)'},{key:'p4ph4',name:'P4 Ph4 (SUP)'}];
  let registrySnap=null; try{ registrySnap=await getDocs(collection(db,'pjt_registry')); }catch(e){}
  const lightPjts=[];
  if(registrySnap) registrySnap.forEach(d=>{ const data=d.data(); if(data.status==='ended') return; lightPjts.push({id:d.id,name:data.name||'PJT'}); projects.push({key:'reg_'+d.id,name:data.name||'PJT',regId:d.id}); });

  // 2. 마스터 명부 + 로스터
  let masterSnap=null; try{ masterSnap=await getDocs(collection(db,'master_workers')); }catch(e){}
  const masterMap={}; if(masterSnap) masterSnap.forEach(d=>{ masterMap[d.id]=d.data(); });
  _masterList=Object.keys(masterMap).map(id=>({id,...masterMap[id]}));

  const rosterFab=await loadRoster(['pjt_workers_fab'],'P4 Ph2 (FAB)',masterMap);
  const rosterSup=await loadRoster(['pjt_workers_ph4'],'P4 Ph4 (SUP)',masterMap);
  let rosterLight=[];
  for(const lp of lightPjts){ const r=await loadRoster(['pjt_registry',lp.id,'workers'],lp.name,masterMap); r.forEach(w=>w.regId=lp.id); rosterLight=rosterLight.concat(r); }
  const fabById={}; rosterFab.forEach(w=>fabById[w.id]=w);
  const supById={}; rosterSup.forEach(w=>supById[w.id]=w);

  // 3. 집계
  const pjtTotals={};
  projects.forEach(p=>{
    let wc=0;
    if(p.key==='p4ph2') wc=rosterFab.length; else if(p.key==='p4ph4') wc=rosterSup.length;
    else wc=rosterLight.filter(w=>w.regId===p.regId).length;
    pjtTotals[p.key]={ name:p.name, total:0, workerCount:wc };
  });
  const personMap={};
  function addToPerson(worker, amount, pjtName, dk){
    const pk=(worker.name||'').trim()+'|'+(worker.birth||'MISSING');
    if(!personMap[pk]) personMap[pk]={ name:worker.name, birth:worker.birth, total:0, byPjt:{}, byDate:{} };
    personMap[pk].total+=amount;
    personMap[pk].byPjt[pjtName]=(personMap[pk].byPjt[pjtName]||0)+amount;
    personMap[pk].byDate[dk]=(personMap[pk].byDate[dk]||{});
    personMap[pk].byDate[dk][pjtName]=(personMap[pk].byDate[dk][pjtName]||0)+amount;
  }
  for(const dk of dateKeys){
    try{ const s=await getDoc(doc(db,'worker_manday',dk)); if(s.exists()){ const md=s.data().md||{};
      Object.keys(md).forEach(wid=>{ const amt=parseFloat(md[wid])||0; if(amt&&fabById[wid]){ pjtTotals['p4ph2'].total+=amt; addToPerson(fabById[wid],amt,'P4 Ph2 (FAB)',dk); } }); } }catch(e){}
  }
  for(const dk of dateKeys){
    try{ const s=await getDoc(doc(db,'ph4_manday',dk)); if(s.exists()){ const md=s.data().md||{};
      Object.keys(md).forEach(wid=>{ const amt=parseFloat(md[wid])||0; if(amt&&supById[wid]){ pjtTotals['p4ph4'].total+=amt; addToPerson(supById[wid],amt,'P4 Ph4 (SUP)',dk); } }); } }catch(e){}
  }
  for(const lp of lightPjts){
    const byId={}; rosterLight.filter(w=>w.regId===lp.id).forEach(w=>byId[w.id]=w);
    const pjtKey='reg_'+lp.id;
    for(const dk of dateKeys){
      try{ const s=await getDoc(doc(db,'pjt_registry',lp.id,'manday',dk)); if(s.exists()){ const md=s.data().md||{};
        Object.keys(md).forEach(wid=>{ const amt=parseFloat(md[wid])||0; if(amt&&byId[wid]){ pjtTotals[pjtKey].total+=amt; addToPerson(byId[wid],amt,lp.name,dk); } }); } }catch(e){}
    }
  }
  _lastPersonMap=personMap;
  render(pjtTotals, personMap);
}

function render(pjtTotals, personMap){
  _lastPjtTotals=pjtTotals; _lastPersonMap=personMap;
  const pjtList=Object.keys(pjtTotals).map(k=>pjtTotals[k]).sort((a,b)=>b.total-a.total);
  const personList=Object.keys(personMap).map(k=>personMap[k]).sort((a,b)=>b.total-a.total);
  _personList=personList;
  const grand=pjtList.reduce((s,p)=>s+p.total,0);
  const missingBirth=personList.filter(p=>!p.birth).length;

  const pjtHtml=pjtList.length ? pjtList.map(p=>`
    <div class="pjt-row"><div><div class="nm">${esc(p.name)}</div><div class="wc">${p.workerCount}명</div></div><div class="tot">${p.total.toFixed(1)}</div></div>
  `).join('') : '<div class="empty">등록된 PJT가 없습니다.</div>';

  const leaders=_masterList.filter(m=>!m.leaderId);
  function totalOf(m){ const key=Object.keys(personMap).find(k=>personMap[k].name===m.name && personMap[k].birth===m.birth); return key?personMap[key].total:0; }
  const teamHtml = leaders.length ? leaders.map(leader=>{
    const members=_masterList.filter(m=>m.leaderId===leader.id);
    let teamMd=totalOf(leader);
    const memberRows=members.map(m=>{ const md=totalOf(m); teamMd+=md; return `<div class="team-member"><span>${esc(m.name)}</span><span>${md.toFixed(1)}공수</span></div>`; }).join('');
    const teamRate=leader.teamRate||0, teamAmt=teamMd*teamRate;
    return `<div class="team-block">
      <div class="team-head"><span>👑 ${esc(leader.name)} 팀 (${members.length}명)</span><span class="tot">${teamMd.toFixed(1)}공수</span></div>
      ${teamRate?`<div class="team-amt">팀단가 ${fmtMoney(teamRate)}원 · 합계 ${fmtMoney(teamAmt)}원</div>`:''}
      <div class="team-member" style="font-weight:700;border-top:none"><span>${esc(leader.name)} (팀장)</span><span>${totalOf(leader).toFixed(1)}공수</span></div>
      ${memberRows}
    </div>`;
  }).join('') : '<div class="empty">등록된 팀이 없습니다.</div>';

  const personHtml = personList.length ? personList.map((p,i)=>`
    <div class="person-row" onclick="showPersonSheet(${i})">
      <div class="top-r"><div class="nm">${esc(p.name)}${p.birth?`<span class="birth">${esc(p.birth)}</span>`:`<span class="warn">⚠ 생년월일 미입력</span>`}</div><div class="tot">${p.total.toFixed(1)}</div></div>
      <div class="badges">${Object.keys(p.byPjt).map(pn=>`<span class="pjt-badge">${esc(pn)} ${p.byPjt[pn].toFixed(1)}</span>`).join('')}</div>
    </div>
  `).join('') : '<div class="empty">이번 달 등록된 공수가 없습니다.</div>';

  $app().innerHTML = topBar('월간 공수') + `
    <div class="hello"><div class="name">월간 공수</div><div class="sub">전체 PJT 통합 · 관리자 전용</div></div>
    <div class="month-nav">
      <button class="month-arrow" onclick="mShift(-1)">‹</button>
      <div class="month-label">${curY}년 ${curM+1}월</div>
      <button class="month-arrow" onclick="mShift(1)">›</button>
    </div>
    <div class="sum-row" style="margin-top:14px">
      <div class="sum-card"><div class="k">합계 공수</div><div class="v">${grand.toFixed(1)}</div></div>
      <div class="sum-card"><div class="k">참여 인원</div><div class="v">${personList.length}</div></div>
      <div class="sum-card"><div class="k">활성 PJT</div><div class="v">${pjtList.length}</div></div>
    </div>
    ${missingBirth?`<div class="warn-box">⚠️ 생년월일 미입력 인원 ${missingBirth}명 — 근로자 마스터 명부에 등록되지 않아 여러 PJT 겸직 시 별도 인원으로 집계될 수 있습니다. PC 월간공수 화면에서 생년월일을 입력해주세요.</div>`:''}
    <div class="lbl">📊 PJT별 합계</div>
    <div class="list">${pjtHtml}</div>
    <div class="lbl">👥 팀별 합계</div>
    <div class="list">${teamHtml}</div>
    <div class="lbl">🙋 개인별 합계</div>
    <div class="list">${personHtml}</div>
  `;
}

// ── 개인별 상세 공수표 + PNG 저장 ──
window.showPersonSheet=function(i){
  const p=_personList[i]; if(!p) return;
  const dates=Object.keys(p.byDate).sort();
  const rows=dates.map(dk=>{
    const [,mm,dd]=dk.split('-');
    const pjts=p.byDate[dk];
    const line=Object.keys(pjts).map(pn=>`${pn} ${pjts[pn].toFixed(1)}`).join(', ');
    const dayTotal=Object.values(pjts).reduce((a,b)=>a+b,0);
    return `<tr><td>${mm}/${dd}</td><td>${esc(line)}</td><td style="text-align:right;font-weight:800">${dayTotal.toFixed(1)}</td></tr>`;
  }).join('');
  $app().innerHTML = topBar('월간 공수') + `
    <div class="hello"><div class="name">${esc(p.name)} 공수표</div><div class="sub">${curY}년 ${curM+1}월 · ${p.birth?esc(p.birth):'생년월일 미입력'}</div></div>
    <div style="margin:14px 20px 0;display:flex;gap:8px">
      <button onclick="closePersonSheet()" style="flex:1;background:#f0f4f9;border:1px solid var(--line);border-radius:12px;padding:11px;font-weight:700;font-size:13px;color:#5c6f8a;cursor:pointer;font-family:inherit">← 목록으로</button>
      <button onclick="savePersonSheetPng(${i})" style="flex:1;background:var(--violet);border:none;border-radius:12px;padding:11px;font-weight:700;font-size:13px;color:#fff;cursor:pointer;font-family:inherit">📥 PNG로 저장</button>
    </div>
    <div id="personSheetCapture" style="margin:14px 20px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;">
      <div style="font-size:15px;font-weight:800;margin-bottom:2px">${esc(p.name)} ${curY}년 ${curM+1}월 공수표</div>
      <div style="font-size:11px;color:var(--sub);margin-bottom:10px">${p.birth?esc(p.birth):'생년월일 미입력'} · 합계 ${p.total.toFixed(1)}공수</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="border-bottom:2px solid #eef2f7">
          <th style="text-align:left;padding:6px 4px;color:#9aa8bc;font-size:10.5px">날짜</th>
          <th style="text-align:left;padding:6px 4px;color:#9aa8bc;font-size:10.5px">PJT별 공수</th>
          <th style="text-align:right;padding:6px 4px;color:#9aa8bc;font-size:10.5px">합계</th>
        </tr></thead>
        <tbody>${rows||'<tr><td colspan="3" style="padding:14px 4px;color:#9aa8bc;text-align:center">기록 없음</td></tr>'}</tbody>
        <tfoot><tr style="border-top:2px solid #eef2f7"><td colspan="2" style="padding:8px 4px;font-weight:800">합계</td><td style="padding:8px 4px;text-align:right;font-weight:800;color:var(--violet)">${p.total.toFixed(1)}</td></tr></tfoot>
      </table>
    </div>
  `;
};
window.closePersonSheet=function(){ render(_lastPjtTotals, _lastPersonMap); };
window.savePersonSheetPng=async function(i){
  const p=_personList[i]; if(!p) return;
  const el=document.getElementById('personSheetCapture'); if(!el || !window.html2canvas) { alert('PNG 저장 기능을 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.'); return; }
  try{
    const canvas=await html2canvas(el, {backgroundColor:'#ffffff', scale:2});
    const link=document.createElement('a');
    link.download=`${p.name}_${curY}${String(curM+1).padStart(2,'0')}_공수표.png`;
    link.href=canvas.toDataURL('image/png');
    link.click();
  }catch(e){ alert('PNG 저장 중 오류: '+e.message); }
};

// ── Firebase Auth 확정 후, portal_users에서 실제 admin 여부를 재확인(클라이언트 localStorage 신뢰 안 함) ──
onAuthStateChanged(auth, async (user)=>{
  if(!user){ showDenied('로그인이 필요합니다. 포털에서 로그인 후 다시 접속해 주세요.'); return; }
  try{
    const uSnap=await getDoc(doc(db,'portal_users',user.uid));
    const uData=uSnap.exists()?uSnap.data():null;
    const isApprovedAdmin=!!(uData && uData.admin===true && uData.status==='approved');
    if(!isApprovedAdmin){ showDenied('월간 공수는 관리자 계정만 접근할 수 있습니다.'); return; }
    loadMonth();
  }catch(e){ showDenied('권한 확인 중 오류가 발생했습니다: '+e.message); }
});
</script>
</body>
</html>
