<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>출퇴근 태그</title>
<!-- NFC 출퇴근 태그 화면(대기열 1-3-26). 사무실 스티커에 폰을 대면 이 주소가 열린다 — 이 경로(/m/tag.html)는 바꾸지 않는다(스티커는 고칠 수 없다).
     로그인 없이 폰에 저장된 기기 토큰으로 본인을 식별한다. 서버 적용 전(NFC_ENABLED 꺼짐)에는 "준비 중" 안내만 보인다. 설계서: Claude Doc "NFC 출퇴근 기록 설계서" -->
<link rel="stylesheet" href="../app/theme/tokens.css?v=20261026q">
<link rel="stylesheet" href="../app/theme/base.css?v=20261026q">
<link rel="stylesheet" href="../app/theme/components.css?v=20261026q">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg, #f5f7fb); }
  #tag-root { width: 100%; max-width: 420px; padding: 24px; box-sizing: border-box; }
  .jh-tag { text-align: center; padding: 32px 20px; border-radius: 16px; background: var(--surface, #fff); box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .jh-tag__icon { font-size: 44px; line-height: 1; margin-bottom: 12px; }
  .jh-tag[data-tone="success"] .jh-tag__icon { color: #1a7f37; }
  .jh-tag[data-tone="warn"] .jh-tag__icon { color: #9a6700; }
  .jh-tag[data-tone="danger"] .jh-tag__icon { color: #cf222e; }
  .jh-tag__title { font-size: 22px; line-height: 1.35; margin: 0 0 8px; }
  .jh-tag__detail { margin: 0 0 12px; color: var(--text-muted, #57606a); }
  .jh-tag__actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .jh-tag__fix { display: inline-block; margin-top: 20px; font-size: 14px; }
</style>
</head>
<body>
<main id="tag-root" aria-busy="true"></main>
<script type="module">
import { functions, httpsCallable } from '../app/core/firebase.js?v=20261030a';
import { NFC_ENABLED, nextStep, tagResultView, errorView, FIXED_VIEWS } from '../app/modules/attendance/nfc-logic.js?v=20261030a';
import { makeNfcApi, makeTokenStore, getPosition } from '../app/modules/attendance/nfc-data.js?v=20261030a';
import { tagCardHtml } from '../app/modules/attendance/nfc-view.js?v=20261030a';

const root = document.getElementById('tag-root');
const REGISTER = '../app/#/attendance/register', INPUT = '../app/#/attendance/input', LOGIN = '../app/';
const show = (vm, extra) => { root.innerHTML = tagCardHtml(vm, extra); root.setAttribute('aria-busy', 'false'); };

async function run() {
  if (!NFC_ENABLED) { show({ tone: 'info', title: '출퇴근 태그 기능을 준비 중입니다', detail: '곧 사용할 수 있습니다. 그때까지는 포털의 출근·퇴근 버튼을 쓰세요.' }, { inputHref: INPUT }); return; }
  const store = makeTokenStore(localStorage); const api = makeNfcApi(httpsCallable(functions, 'attendNfcAct'));
  show(FIXED_VIEWS.locating);
  try {
    const token = store.load();
    const st = token ? await api.status(token) : null; const step = nextStep(token, st);
    if (step.next === 'register') { show(FIXED_VIEWS.register, { registerHref: REGISTER }); return; }
    if (step.next === 'pending') { show(FIXED_VIEWS.pending, { inputHref: INPUT }); return; }
    if (step.next === 'revoked') { store.clear(); show(FIXED_VIEWS.revoked, { registerHref: REGISTER }); return; }
    const pos = await getPosition(navigator, 8000);   // 위치는 이 순간 한 번만 — 거부하거나 못 가져와도 기록은 위치 미확인으로 진행
    show(FIXED_VIEWS.sending);
    const r = await api.tag(token, pos); const vm = tagResultView(r); show(vm, { inputHref: INPUT });
    if (vm.autoClose) setTimeout(() => { try { window.close(); } catch (e) { /* 닫을 수 없으면 그대로 둔다 */ } }, 3000);
  } catch (e) {
    console.error('태그', e); const vm = errorView(e); show(vm, { retry: true, loginHref: vm.needsLogin ? LOGIN : '', inputHref: INPUT });
  }
}
root.addEventListener('click', (ev) => { if (ev.target.closest('[data-tag-retry]')) run(); });
run();
</script>
</body>
</html>
