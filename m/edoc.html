<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전자결재 · JH Solutions</title>
<style>
  :root{--blue:#1D5BA6;--blue-d:#16487f;--ink:#1a2330;--sub:#6b7787;--line:#e4eaf2;--bg:#eef2f7;--card:#fff;--ok:#1b8a5a;--warn:#c0392b;--amber:#e08a1e;--violet:#7C3AED}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Apple SD Gothic Neo','Pretendard',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
  .phone{width:100%;max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh}
  .scr{padding:0 0 30px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 4px}
  .back{background:var(--card);border:1px solid var(--line);color:var(--blue);font-size:13px;font-weight:700;padding:8px 14px;border-radius:12px;cursor:pointer;font-family:inherit;box-shadow:0 2px 6px rgba(30,50,80,.05)}
  .back:active{background:#f0f4f9}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;box-shadow:0 4px 10px rgba(29,91,166,.3);cursor:pointer}
  .hello{padding:18px 24px 6px}
  .hello.rowend{display:flex;align-items:flex-end;justify-content:space-between}
  .hello .name{font-size:25px;font-weight:800;letter-spacing:-.5px;color:var(--violet)}
  .hello .sub{font-size:12.5px;color:var(--sub);margin-top:4px;font-weight:600}
  .summary{display:flex;gap:10px;margin:16px 20px 0;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .summary .s{flex:1;text-align:center}
  .summary .s + .s{border-left:1px solid var(--line)}
  .summary .s .n{font-size:20px;font-weight:800;color:var(--violet)}
  .summary .s .n.wait{color:var(--amber)}
  .summary .s .k{font-size:10.5px;color:var(--sub);font-weight:600;margin-top:2px}
  .lbl{font-size:12px;font-weight:800;color:#9aa8bc;letter-spacing:.5px;padding:22px 24px 12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px}
  .tile{background:var(--card);border-radius:20px;padding:18px 16px 16px;border:1px solid var(--line);cursor:pointer;position:relative;transition:transform .12s ease;display:flex;flex-direction:column;gap:12px;min-height:124px;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .tile:active{transform:scale(.96)}
  .tile .ic{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:25px}
  .tile .nm{font-size:15px;font-weight:800;letter-spacing:-.3px}
  .tile .ds{font-size:11px;color:var(--sub);font-weight:500;line-height:1.4;margin-top:-4px}
  .tile .go{position:absolute;top:16px;right:14px;font-size:15px;color:#c3cedd}
  .tile .badge{position:absolute;top:14px;right:32px;background:var(--warn);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .c1 .ic{background:#f0edfb;color:#7C3AED}.c2 .ic{background:#eaf2fc;color:#1D5BA6}
  .c3 .ic{background:#e7f5ee;color:#1b8a5a}.c4 .ic{background:#eceff1;color:#455a64}
  .c5 .ic{background:#e0f2f1;color:#0d9488}.c6 .ic{background:#fdeede;color:#e08a1e}
  .c7 .ic{background:#fdecf0;color:#db2777}
  .wide{margin:14px 20px 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:15px;cursor:pointer;transition:transform .12s ease;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .wide:active{transform:scale(.98)}
  .wide .ic{width:50px;height:50px;border-radius:15px;flex-shrink:0;background:#fdecf0;color:#db2777;display:flex;align-items:center;justify-content:center;font-size:25px}
  .wide .nm{font-size:15px;font-weight:800}.wide .ds{font-size:11px;color:var(--sub);margin-top:2px}
  .wide .go{margin-left:auto;font-size:15px;color:#c3cedd}
  .list{padding:16px 20px 0;display:flex;flex-direction:column;gap:12px}
  .empty{margin:24px 20px;padding:26px;text-align:center;color:#9aa8bc;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:16px}
  .loading{text-align:center;padding:40px;color:#9aa8bc;font-size:13px;font-weight:600}
  .dcard-list{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;cursor:pointer;transition:transform .12s ease;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .dcard-list:active{transform:scale(.985)}
  .dl-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .dl-title{font-size:15px;font-weight:800;flex:1}
  .stbadge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .st-wait{background:#fdeede;color:#b45309}.st-ok{background:#e7f5ee;color:#1b8a5a}
  .st-rej{background:#fdecea;color:#c0392b}.st-draft{background:#eef1f5;color:#8a97a8}
  .dl-meta{font-size:11.5px;color:var(--sub);font-weight:500;margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:#eef2f7;color:#5c6f8a}
  .appr-filters{display:flex;gap:8px;padding:0 20px 12px}
  .appr-filters select{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;font-family:inherit;background:var(--card);color:var(--ink)}
  .dcard{margin:16px 20px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 16px;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .drow{display:flex;align-items:flex-start;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f2f5f9;gap:12px}
  .drow:last-child{border-bottom:none}
  .dk{font-size:12.5px;color:var(--sub);font-weight:600;white-space:nowrap}
  .dv{font-size:13px;font-weight:600;text-align:right;line-height:1.5}
  .banner{margin:14px 20px 0;padding:11px 14px;border-radius:12px;font-size:11.5px;font-weight:600;line-height:1.5}
  .banner.info{background:#eef4fc;border:1px solid #d6e4f6;color:var(--blue-d)}
  .banner.err{background:#fdecea;border:1px solid #f5c6c0;color:#a5342a}

  .wform{padding:0 20px 40px}
  .wf{margin-bottom:14px}
  .wf label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px}
  .wf input,.wf textarea,.wf select{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  .wf textarea{min-height:70px;resize:vertical}
  .wf input:focus,.wf textarea:focus,.wf select:focus{outline:none;border-color:var(--violet)}
  .wline{font-size:12px;color:var(--sub);background:#f4f2fb;border-radius:10px;padding:11px 13px;margin:6px 0 14px;line-height:1.7}
  .wamt{font-size:15px;font-weight:800;color:var(--violet);margin:0 0 14px}
  .wsave{width:100%;padding:15px;background:var(--violet);border:none;border-radius:13px;color:#fff;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
  .fab-w{position:fixed;right:18px;bottom:24px;width:54px;height:54px;border-radius:50%;background:var(--violet);color:#fff;border:none;font-size:28px;box-shadow:0 6px 18px rgba(124,77,255,.4);cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center}
</style>
<script src="auth-guard.js"></script>
</head>
<body>
  <div class="phone"><div id="app" class="scr"><div class="loading">불러오는 중…</div></div></div>

<script type="module">
const _uInitial=(function(){try{var a=JSON.parse(localStorage.getItem('jh_login_perms')||'null');return (a&&a.name)?a.name.slice(0,1):'·';}catch(e){return '·';}})();
const _me=(function(){try{return JSON.parse(localStorage.getItem('jh_login_perms')||'null')||{};}catch(e){return {};}})();
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, onSnapshot, doc, getDoc, getDocs, setDoc, addDoc, deleteDoc, serverTimestamp, query, where, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
const firebaseConfig = {
  apiKey:"AIzaSyDwkKOrRU1LF_N7fiVNWc5CRp-abopSyrI", authDomain:"portal-test-6e0ff.firebaseapp.com",
  projectId:"portal-test-6e0ff", storageBucket:"portal-test-6e0ff.firebasestorage.app",
  messagingSenderId:"752763010816", appId:"1:752763010816:web:4a0c7062a2f1a4e9a03de5"
};
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app);

let dailies=[], leaves=[], purchases=[], expenses=[], resigns=[], certs=[];
let curView='home', detailId=null, loadError='';

const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $app=()=>document.getElementById('app');
const WAIT=['pending','reviewing'], OKS=['approved','done','posted'];
const isWait=s=>WAIT.includes(s), isOk=s=>OKS.includes(s), isRej=s=>s==='rejected', isDraft=s=>s==='draft';
function stBadge(s){
  if(isOk(s))return '<span class="stbadge st-ok">승인</span>';
  if(isRej(s))return '<span class="stbadge st-rej">반려</span>';
  if(isDraft(s))return '<span class="stbadge st-draft">임시</span>';
  if(isWait(s))return '<span class="stbadge st-wait">결재중</span>';
  return `<span class="stbadge st-draft">${esc(s||'-')}</span>`;
}
const fmtDate=v=>{if(!v)return '';if(v.seconds)return new Date(v.seconds*1000).toISOString().slice(0,10);return String(v).slice(0,10);};
// 업무 기준일: 오전 6시 전이면 전날로 (PC와 통일). 로컬(한국) 시각 기준.
function bizToday(){ const d=new Date(); if(d.getHours()<6) d.setDate(d.getDate()-1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* 화면 전환 + History */
function nav(v,id){ curView=v; detailId=id||null; history.pushState({v,id:id||null},''); render(); window.scrollTo(0,0); }
function showView(v){ nav(v,null); }
function showDetail(v,id){ nav(v+'D',id); }
window.showView=showView; window.showDetail=showDetail;
window.goBack=function(){ history.back(); };
window.goAccount=function(){ location.href='account.html'; };
window.goHome=function(){ location.href='home.html'; };
window.addEventListener('popstate',e=>{ const st=e.state||{v:'home',id:null}; curView=st.v; detailId=st.id||null; render(); window.scrollTo(0,0); });

function render(){
  if(loadError){ $app().innerHTML=topBar('전자결재')+`<div class="banner err">데이터를 불러오지 못했습니다: ${esc(loadError)}<br>포털 로그인 세션이 필요할 수 있습니다.</div>`; return; }
  const map={home:renderHome,approve:renderApprove,daily:renderDaily,leave:renderLeave,dailyD:renderDailyDetail,leaveD:renderLeaveDetail,
    dailyW:renderDailyWrite,leaveW:renderLeaveWrite,
    purchase:()=>renderDocListM('purchase'),purchaseD:()=>renderDocDetailM('purchase'),purchaseW:()=>renderDocWriteM('purchase'),
    expense:()=>renderDocListM('expense'),expenseD:()=>renderDocDetailM('expense'),expenseW:()=>renderDocWriteM('expense'),
    resign:()=>renderDocListM('resign'),resignD:()=>renderDocDetailM('resign'),resignW:()=>renderDocWriteM('resign'),
    cert:()=>renderDocListM('cert'),certD:()=>renderDocDetailM('cert'),certW:()=>renderDocWriteM('cert'),
    mycard:renderMyCardM,attendance:renderAttendanceTabM};
  (map[curView]||renderHome)();
}
function topBar(label,onclick){ return `<div class="top"><button class="back" onclick="${onclick||'goBack()'}">← ${label}</button><div class="avatar" onclick="goAccount()">${_uInitial}</div></div>`; }

function renderHome(){
  const allDocs=[...dailies,...leaves];
  const waitCnt=allDocs.filter(d=>isWait(d.status)).length;
  const okCnt=allDocs.filter(d=>isOk(d.status)).length;
  $app().innerHTML=`
    <div class="top"><button class="back" onclick="goHome()">← 홈</button><div class="avatar" onclick="goAccount()">${_uInitial}</div></div>
    <div class="hello"><div class="name">전자결재</div><div class="sub">업무일지 · 연차 · 구매품의 · 지출결의</div></div>
    <div class="summary">
      <div class="s"><div class="n wait">${waitCnt}</div><div class="k">결재 대기</div></div>
      <div class="s"><div class="n">${okCnt}</div><div class="k">승인 완료</div></div>
      <div class="s"><div class="n">${dailies.length}</div><div class="k">업무일지</div></div>
    </div>
    <div class="lbl">메뉴</div>
    <div class="grid">
      <div class="tile c1" onclick="showView('approve')"><span class="go">›</span>${waitCnt?`<span class="badge">${waitCnt}</span>`:''}<div class="ic">📥</div><div class="nm">결재함</div><div class="ds">대기·완료</div></div>
      <div class="tile c2" onclick="showView('daily')"><span class="go">›</span><div class="ic">📔</div><div class="nm">업무일지</div><div class="ds">일일 업무</div></div>
      <div class="tile c6" onclick="showView('purchase')"><span class="go">›</span><div class="ic">🛒</div><div class="nm">구매품의서</div><div class="ds">구매 품의</div></div>
      <div class="tile c7" onclick="showView('expense')"><span class="go">›</span><div class="ic">💳</div><div class="nm">지출결의서</div><div class="ds">지출 결의</div></div>
      <div class="tile c3" onclick="showView('leave')"><span class="go">›</span><div class="ic">🌴</div><div class="nm">연차신청서</div><div class="ds">연차 신청</div></div>
      <div class="tile c5" onclick="showView('cert')"><span class="go">›</span><div class="ic">📃</div><div class="nm">재직증명서</div><div class="ds">증명 발급</div></div>
      <div class="tile c8" onclick="showView('resign')"><span class="go">›</span><div class="ic" style="background:#fdecf0;color:#db2777">📄</div><div class="nm">퇴직원서</div><div class="ds">퇴직 신청</div></div>
      <div class="tile c4" onclick="showView('mycard')"><span class="go">›</span><div class="ic" style="background:#e0f2f1;color:#0d9488">🪪</div><div class="nm">인사카드</div><div class="ds">내 정보 조회</div></div>
      <div class="tile c2" onclick="showView('attendance')"><span class="go">›</span><div class="ic" style="background:#eaf2fc;color:#1D5BA6">⏰</div><div class="nm">출퇴근 기록</div><div class="ds">월별 조회·수정</div></div>
    </div>`;
}

function dailyCard(d){
  return `<div class="dcard-list" onclick="showDetail('daily','${d.id}')">
    <div class="dl-top"><div class="dl-title">${esc(d.title||d.dtype||'업무일지')}</div>${stBadge(d.status)}</div>
    <div class="dl-meta">${d.pjtCode?`<span class="pill">${esc(d.pjtCode)}</span>`:''}${d.authorName?esc((d.authorDept||'')+' '+d.authorName).trim():''}${d.date||d.createdAt?' · '+fmtDate(d.date||d.createdAt):''}</div></div>`;
}
function leaveCard(l){
  return `<div class="dcard-list" onclick="showDetail('leave','${l.id}')">
    <div class="dl-top"><div class="dl-title">${esc(l.title||l.name||'연차신청')} <span class="pill">${esc(l.leaveType||l.type||'연차')}</span></div>${stBadge(l.status)}</div>
    <div class="dl-meta">${esc(fmtDate(l.startDate||l.sdate))}${l.endDate||l.edate?' ~ '+esc(fmtDate(l.endDate||l.edate)):''} · ${l.days||l.leaveDays||0}일</div></div>`;
}
function itemsTotal(items){ if(!Array.isArray(items))return 0; return items.reduce((s,it)=>s+((it.amount!=null?Number(it.amount):(Number(it.qty)||0)*(Number(it.unitPrice)||0))||0),0); }
const APPR_TYPE_LABEL={daily:'업무일지',leave:'연차신청서',resign:'퇴직원서',cert:'재직증명서',purchase:'구매품의서',expense:'지출결의서'};
const APPR_STATUS_LABEL={all:'전체 단계',wait:'결재중',done:'결재완료',rejected:'반려'};
const APPR_STATUS_GROUP={wait:['pending','reviewing'],done:['approved','posted','done'],rejected:['rejected']};
let _apprStatus='all', _apprType='all', _apprAuthor='all';
window.apprSetStatus=function(v){_apprStatus=v; renderApprove();};
window.apprSetType=function(v){_apprType=v; renderApprove();};
window.apprSetAuthor=function(v){_apprAuthor=v; renderApprove();};
function renderApprove(){
  const all=[...dailies.map(d=>({t:'daily',d})),...leaves.map(l=>({t:'leave',d:l})),
    ...purchases.map(p=>({t:'purchase',d:p})),...expenses.map(x=>({t:'expense',d:x})),
    ...resigns.map(r=>({t:'resign',d:r})),...certs.map(c=>({t:'cert',d:c}))];
  const waitCnt=all.filter(x=>isWait(x.d.status)).length;
  const authors=Array.from(new Set(all.map(x=>x.d.authorName||x.d.name||'').filter(Boolean))).sort((a,b)=>a.localeCompare(b,'ko'));
  // 목록이 바뀌어 이전에 고른 작성자가 더 이상 없으면 전체로 되돌림
  if(_apprAuthor!=='all'&&!authors.includes(_apprAuthor)) _apprAuthor='all';
  const filtered=all.filter(x=>{
    if(_apprType!=='all'&&x.t!==_apprType) return false;
    if(_apprAuthor!=='all'&&(x.d.authorName||x.d.name||'')!==_apprAuthor) return false;
    if(_apprStatus!=='all'&&!(APPR_STATUS_GROUP[_apprStatus]||[]).includes(x.d.status||'')) return false;
    return true;
  }).sort((a,b)=>{const sa=isWait(a.d.status)?0:1,sb=isWait(b.d.status)?0:1;if(sa!==sb)return sa-sb;return (fmtDate(b.d.createdAt||b.d.date)).localeCompare(fmtDate(a.d.createdAt||a.d.date));});
  const cardFn={daily:dailyCard,leave:leaveCard,purchase:d=>docCardM('purchase',d),expense:d=>docCardM('expense',d),
    resign:d=>docCardM('resign',d),cert:d=>docCardM('cert',d)};
  const cards=filtered.map(x=>cardFn[x.t](x.d)).join('');
  const statusOpts=Object.keys(APPR_STATUS_LABEL).map(k=>`<option value="${k}" ${_apprStatus===k?'selected':''}>${APPR_STATUS_LABEL[k]}</option>`).join('');
  const typeOpts=['all',...Object.keys(APPR_TYPE_LABEL)].map(k=>`<option value="${k}" ${_apprType===k?'selected':''}>${k==='all'?'전체 종류':APPR_TYPE_LABEL[k]}</option>`).join('');
  const authorOpts=['all',...authors].map(a=>`<option value="${esc(a)}" ${_apprAuthor===a?'selected':''}>${a==='all'?'전체 작성자':esc(a)}</option>`).join('');
  const activeFilters=(_apprStatus!=='all'?1:0)+(_apprType!=='all'?1:0)+(_apprAuthor!=='all'?1:0);
  $app().innerHTML=topBar('전자결재')+`
    <div class="hello rowend"><div><div class="name">결재함</div><div class="sub">대기 ${waitCnt} · 전체 ${all.length}${activeFilters?' · 조회 '+filtered.length+'건':''}</div></div></div>
    <div class="appr-filters">
      <select onchange="apprSetStatus(this.value)">${statusOpts}</select>
      <select onchange="apprSetType(this.value)">${typeOpts}</select>
      <select onchange="apprSetAuthor(this.value)">${authorOpts}</select>
    </div>
    ${filtered.length?`<div class="list">${cards}</div>`:'<div class="empty">조건에 맞는 문서가 없습니다.</div>'}`;
}
let _dailyViewM='calendar', _dailyCalYearM=new Date().getFullYear(), _dailyCalMonthM=new Date().getMonth()+1, _dailySelDateM=null;
window.dailySetViewM=function(v){ _dailyViewM=v; render(); };
window.dailyCalNavM=function(delta){
  _dailyCalMonthM+=delta;
  if(_dailyCalMonthM<1){_dailyCalMonthM=12;_dailyCalYearM--;} else if(_dailyCalMonthM>12){_dailyCalMonthM=1;_dailyCalYearM++;}
  _dailySelDateM=null; render();
};
window.dailyCalTodayM=function(){
  const t=new Date(); _dailyCalYearM=t.getFullYear(); _dailyCalMonthM=t.getMonth()+1;
  _dailySelDateM=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  render();
};
window.dailyCalPickDateM=function(dateStr){ _dailySelDateM=(_dailySelDateM===dateStr)?null:dateStr; render(); };

let _leaveCalYearM=new Date().getFullYear(), _leaveCalMonthM=new Date().getMonth()+1;
// PC calcAnnualLeaveGrant/sumLeaveUsed와 동일한 계산식
function calcAnnualLeaveGrantM(hireDateStr, baseDateStr){
  if(!hireDateStr) return {granted:0,years:0,months:0,detail:'입사일 미등록'};
  const hire=new Date(hireDateStr);
  const base=baseDateStr?new Date(baseDateStr):new Date();
  if(isNaN(hire.getTime())||base<hire) return {granted:0,years:0,months:0,detail:'-'};
  let years=base.getFullYear()-hire.getFullYear();
  const mDiff=base.getMonth()-hire.getMonth(), dDiff=base.getDate()-hire.getDate();
  if(mDiff<0||(mDiff===0&&dDiff<0)) years--;
  const totalMonths=(base.getFullYear()-hire.getFullYear())*12+(base.getMonth()-hire.getMonth())-(base.getDate()<hire.getDate()?1:0);
  let granted=0, detail='';
  if(years<1){ granted=Math.min(Math.max(totalMonths,0),11); detail=`입사 ${Math.max(totalMonths,0)}개월 (월 1일, 최대 11일)`; }
  else{ granted=15; if(years>=3) granted=Math.min(15+Math.floor((years-1)/2),25); detail=`근속 ${years}년차 (15일${granted>15?` +${granted-15}`:''})`; }
  return {granted,years,months:Math.max(totalMonths,0),detail};
}
function sumLeaveUsedM(leaveDocs, workerName){
  let used=0;
  for(const lv of leaveDocs){
    const nm=lv.authorName||lv.name||''; if(nm!==workerName) continue;
    if(lv.status!=='posted'&&lv.status!=='approved') continue;
    const days=parseFloat(lv.days||lv.leaveDays||0); if(!isNaN(days)) used+=days;
  }
  return used;
}
function leaveEntriesOnDateM(dateStr){
  return leaves.filter(d=>{
    if(!d.startDate||!d.endDate) return false;
    if(d.status==='rejected'||d.status==='draft') return false;
    return dateStr>=d.startDate && dateStr<=d.endDate;
  });
}
window.leaveCalShiftM=function(delta){
  _leaveCalMonthM+=delta;
  if(_leaveCalMonthM>12){_leaveCalMonthM=1;_leaveCalYearM++;}
  if(_leaveCalMonthM<1){_leaveCalMonthM=12;_leaveCalYearM--;}
  render();
};

function leaveCalendarGridM(){
  const y=_leaveCalYearM, m=_leaveCalMonthM;
  const first=new Date(y,m-1,1), lastDate=new Date(y,m,0).getDate(), firstDow=first.getDay();
  const today=new Date(), todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  const DOW=['일','월','화','수','목','금','토'];
  let html=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px">
    ${DOW.map((w,i)=>`<div style="text-align:center;font-size:10.5px;font-weight:700;color:${i===0?'#E05':(i===6?'var(--blue)':'var(--sub)')};padding:4px 0">${w}</div>`).join('')}
  </div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">`;
  for(let i=0;i<firstDow;i++) html+='<div></div>';
  for(let day=1; day<=lastDate; day++){
    const dateStr=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const entries=leaveEntriesOnDateM(dateStr);
    const status=entries.length?(entries.some(d=>d.status==='approved'||d.status==='posted')?'approved':'pending'):null;
    const isToday=dateStr===todayStr;
    const dow=(firstDow+day-1)%7;
    let bg='transparent', fg='var(--ink)', fw='500';
    if(status==='approved'){bg='var(--blue)';fg='#fff';fw='700';}
    else if(status==='pending'){bg='#FEF3C7';fg='#92400E';fw='700';}
    else if(dow===0) fg='#E05'; else if(dow===6) fg='var(--blue)';
    const border=isToday?'border:1.5px solid var(--blue)':'';
    const badge=entries.length>1?`<span style="font-size:8px;position:relative;top:-1px">+${entries.length}</span>`:'';
    html+=`<div onclick="leaveShowDayDetailM('${dateStr}')" style="text-align:center;padding:9px 2px;border-radius:9px;font-size:12.5px;background:${bg};color:${fg};font-weight:${fw};${border};cursor:pointer">${day}${badge}</div>`;
  }
  html+='</div>';
  return html;
}

// ===== 결재 (승인/반려) =====
function canApprove(d){
  if(!d||!Array.isArray(d.approvalLine)) return false;
  const st=d.status||'';
  if(st==='approved'||st==='rejected'||st==='posted'||st==='done') return false; // 이미 결재 완료된 문서
  const nm=_me.name||'', uid=_me.uid||'';
  const isApRole=r=>/^결재/.test(r||''); // '결재', '결재1', '결재2' 등 다단계 결재 모두 인식 (PC와 동일)
  const hasPending=d.approvalLine.some(s=>isApRole(s.role)&&s.status==='pending');
  if(_me.admin && hasPending) return true; // 관리자(대표)는 대기 결재 대행
  return d.approvalLine.some(s=>isApRole(s.role)&&s.status==='pending'&&((uid&&s.uid===uid)||(!s.uid&&s.name===nm)));
}
// 삭제 권한: 작성자 본인 또는 관리자
function canDelete(d){
  if(!d) return false;
  const uid=_me.uid||'';
  if(!!_me.admin) return true;                       // 관리자
  if(uid && d.authorUid===uid) return true;          // 작성자 본인
  const st=d.status||'';
  // 아직 결재 완료 전(임시/대기/검토) 문서는 상신 취소(삭제) 허용
  if(st==='draft'||st==='pending'||st==='reviewing') return true;
  return false;
}

    <button onclick="mobileApprove('${id}','${dtype}','rejected','${payload}')" style="flex:1;padding:14px;background:#DC2626;border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer">❌ 반려</button>
  </div>`;

window.mobileApprove=async function(docId, dtype, newStatus, docDataStr){
  const labels={approved:'승인',rejected:'반려'};
  if(!confirm(`이 문서를 [${labels[newStatus]}] 처리하시겠습니까?`)) return;
  try{
    const rawData=typeof docDataStr==='string'?JSON.parse(decodeURIComponent(docDataStr)):(docDataStr||{});
    const origLine=rawData.approvalLine||[];
    const approverName=_me.name||'', myUid=_me.uid||'';
    const isMyStep=s=>{
      if(s.role==='회람'||s.role==='수신'||s.role==='작성')return false;
      if(s.status!=='pending')return false;
      if(_me.admin) return true; // 관리자는 대기 결재단계 대행
      return (myUid&&s.uid===myUid)||(!s.uid&&s.name===approverName);
    };
    const line=origLine.map(s=>{
      if(!isMyStep(s))return s;
      return {...s, uid:myUid, status:newStatus==='rejected'?'rejected':'approved', approvedBy:approverName, approvedAt:new Date().toISOString()};
    });
    let docStatus=newStatus;
    if(newStatus==='approved'){
      const myIdx=origLine.findIndex(isMyStep);
      const hasNext=myIdx>=0&&origLine.slice(myIdx+1).some(s=>s.role!=='회람'&&s.role!=='수신'&&s.role!=='작성'&&s.status==='pending');
      docStatus=hasNext?'reviewing':'approved';
    }
    await setDoc(doc(db,`edoc_${dtype}`,docId),{status:docStatus,approvalLine:line,approvedBy:approverName,approvedAt:serverTimestamp()},{merge:true});
    alert(`✅ ${labels[newStatus]} 처리되었습니다.`);
    goBack();
  }catch(e){ alert('오류: '+e.message); }
};

let _userDirectory=null;
async function resolveUid(name){
  if(!_userDirectory){
    _userDirectory={};
    try{
      const snap=await getDocs(collection(db,'portal_users'));
      snap.forEach(d=>{ const v=d.data(); if(v && v.name) _userDirectory[v.name]=d.id; });
    }catch(e){ console.error('사용자 조회 실패',e); }
  }
  return _userDirectory[name]||'';
}
async function fillUids(line){
  for(const item of line){ if(!item.uid && item.name){ item.uid=await resolveUid(item.name); } }
  return line;
}
function viewerUidsOf(line){
  const set=new Set(); (line||[]).forEach(x=>{ if(x.uid) set.add(x.uid); });
  return Array.from(set);
}

// PC calcLeaveDays와 동일: 반차류는 0.5일 고정, 그 외는 평일수 계산
function calcLeaveDaysM(startDate,endDate,leaveType){
  if(leaveType&&leaveType.includes('반차')) return 0.5;
  if(!startDate||!endDate) return '';
  const s=new Date(startDate), e=new Date(endDate);
  if(isNaN(s)||isNaN(e)) return '';
  let d=0; const cur=new Date(s);
  while(cur<=e){ const dow=cur.getDay(); if(dow!==0&&dow!==6) d++; cur.setDate(cur.getDate()+1); }
  return d;
}

window.fmtTelM=function(v){
  const d=(v||'').replace(/\D/g,'');

  if(d.length<=6) return d.slice(0,3)+'-'+d.slice(3);
  if(d.length<=10) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7,11);
};

const EDOC_KR_HOLIDAYS_M=new Set(['2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-01','2026-03-02','2026-05-05','2026-05-25',
  '2026-06-03','2026-06-06','2026-07-17','2026-08-17','2026-09-24','2026-09-25','2026-09-26','2026-10-05','2026-10-09','2026-12-25']);
function edocMonthlyStandardHoursM(year,month){
  const first=new Date(year,month-1,1), last=new Date(year,month,0);
  let workDays=0; const cur=new Date(first);
  while(cur<=last){
    const dow=cur.getDay(), key=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
    if(dow!==0&&dow!==6&&!EDOC_KR_HOLIDAYS_M.has(key)) workDays++;
    cur.setDate(cur.getDate()+1);
  }
  return workDays*8;
}
function edocIsoWeekKeyM(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dayNum=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-dayNum+3);
  const firstThursday=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  const weekNum=1+Math.round(((t-firstThursday)/86400000-3+(firstThursday.getUTCDay()+6)%7)/7);
  return `${t.getUTCFullYear()}-W${weekNum}`;
}
function edocMonthlyMaxOvertimeHoursM(year,month){
  const first=new Date(year,month-1,1), last=new Date(year,month,0);
  const weeks=new Set(); const cur=new Date(first);
  while(cur<=last){ weeks.add(edocIsoWeekKeyM(cur)); cur.setDate(cur.getDate()+1); }
  return weeks.size*12;
}
function isLeavePaidM(leaveType){ return /\(유급\)/.test(leaveType||''); }
function computeLeaveHoursForMonthM(year,month){
  const ym=year+'-'+String(month).padStart(2,'0'); let hours=0;
  for(const lv of leaves){
    if((lv.authorName||lv.name||'')!==(_me.name||'')) continue;
    if(lv.status!=='posted'&&lv.status!=='approved') continue;
    if(!isLeavePaidM(lv.leaveType)) continue;
    if(!lv.startDate||!lv.endDate) continue;
    const perDay=(/반차/.test(lv.leaveType||'')||lv.days===0.5)?4:8;
    const cur=new Date(lv.startDate), end=new Date(lv.endDate);
    while(cur<=end){ const key=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0'); if(key===ym) hours+=perDay; cur.setDate(cur.getDate()+1); }
  }
  return hours;
}
function attCalcWorkHoursM(inV,outV,brk){
  if(!inV||!outV) return 0;
  const [ih,im]=inV.split(':').map(Number), [oh,om]=outV.split(':').map(Number);
  let mins=(oh*60+om)-(ih*60+im); if(mins<=0) mins+=24*60; mins-=(brk||0); if(mins<0) mins=0;
  return mins/60;
}
function attSnapTo10MinM(t){
  if(!t) return t; const [h,m]=t.split(':').map(Number);
  let total=h*60+Math.round(m/10)*10; if(total>=1440) total-=1440; if(total<0) total+=1440;
  return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}
let _attYearM=new Date().getFullYear(), _attMonthM=new Date().getMonth()+1, _attEditDateM=bizDateKeyM();
async function attLoadEditCardM(dateStr){
  _attEditDateM=dateStr;
  const box=document.getElementById('att-edit-card'); if(!box) return;
  box.innerHTML='<div style="text-align:center;color:#9aa8bc;padding:20px 0">불러오는 중…</div>';
  let existing={checkIn:'07:00',checkOut:'18:00',breakMinutes:120};
  try{
    const snap=await getDoc(doc(db,'worker_attendance_log',`${_myWorkerId}_${dateStr}`));
    if(snap.exists()){ const dd=snap.data(); existing={checkIn:dd.checkIn||existing.checkIn,checkOut:dd.checkOut||existing.checkOut,breakMinutes:dd.breakMinutes??existing.breakMinutes}; }
  }catch(e){ console.warn('출퇴근 기록 조회 실패',e); }
  const isToday=dateStr===bizDateKeyM();
  const dObj=new Date(dateStr+'T00:00:00'), wd=['일','월','화','수','목','금','토'][dObj.getDay()];
  const dateLabel=`${dObj.getFullYear()}년 ${dObj.getMonth()+1}월 ${dObj.getDate()}일 ${wd}요일`;
  box.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="font-size:13px;font-weight:700">${isToday?'📅 오늘':'✏️ 수정'} · ${esc(dateLabel)}</div>
      ${isToday?'':`<button onclick="attLoadEditCardM('${bizDateKeyM()}')" style="border:none;background:#F0F4F9;border-radius:7px;padding:4px 10px;font-size:11px;color:var(--sub);cursor:pointer;font-family:inherit">오늘로</button>`}
    </div>
    <div style="display:flex;gap:10px;margin-bottom:10px">
      <div style="flex:1"><div style="font-size:11px;color:var(--sub);margin-bottom:5px">출근시간</div><input type="time" id="att-checkin" value="${existing.checkIn}" step="600" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:14px;font-family:inherit"></div>
      <div style="flex:1"><div style="font-size:11px;color:var(--sub);margin-bottom:5px">퇴근시간</div><input type="time" id="att-checkout" value="${existing.checkOut}" step="600" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:14px;font-family:inherit"></div>
    </div>
    <div style="max-width:160px;margin-bottom:12px"><div style="font-size:11px;color:var(--sub);margin-bottom:5px">휴게시간(분)</div><input type="number" id="att-break" value="${existing.breakMinutes}" min="0" step="10" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:14px;font-family:inherit"></div>
    <div style="text-align:center;padding:14px 0;background:#F0F4F9;border-radius:10px;margin-bottom:12px">
      <div id="att-hours-val-m" style="font-size:28px;font-weight:800;color:var(--blue)">${attCalcWorkHoursM(existing.checkIn,existing.checkOut,existing.breakMinutes).toFixed(1)}h</div>
      <div style="font-size:11px;color:var(--sub);margin-top:4px">${isToday?'오늘':'해당 날짜'} 근무시간 (휴게시간 제외)</div>
    </div>
    <button class="wsave" onclick="attSaveM()">💾 저장</button>
    <div id="att-save-status-m" style="font-size:11px;text-align:center;margin-top:8px"></div>`;
  const refresh=()=>{
    const h=attCalcWorkHoursM(fv('att-checkin'),fv('att-checkout'),parseFloat(fv('att-break'))||0);
    document.getElementById('att-hours-val-m').textContent=h.toFixed(1)+'h';
  };
  ['att-checkin','att-checkout'].forEach(id=>{
    const inp=document.getElementById(id);
    inp.addEventListener('input',refresh);
    inp.addEventListener('change',e=>{ const s=attSnapTo10MinM(e.target.value); if(s&&s!==e.target.value) e.target.value=s; refresh(); });
  });
  document.getElementById('att-break').addEventListener('input',refresh);
}
window.attPickDayM=function(dateStr){ attLoadEditCardM(dateStr); document.getElementById('att-edit-card')?.scrollIntoView({behavior:'smooth',block:'start'}); };
window.renderAttendanceTabM=async function(){
  $app().innerHTML=topBar('전자결재')+'<div class="loading">⏳ 불러오는 중…</div>';
  if(!_myWorkerId){ $app().innerHTML=topBar('전자결재')+'<div class="empty">계정이 근무자 명부와 연동되어 있지 않습니다.<br>인사 담당자에게 "근무자 연동"을 요청해주세요.</div>'; return; }
  _attYearM=new Date().getFullYear(); _attMonthM=new Date().getMonth()+1; _attEditDateM=bizDateKeyM();
  $app().innerHTML=topBar('전자결재')+`
    <div class="hello"><div class="name" style="font-size:18px">⏰ 출퇴근 기록</div><div class="sub">월별 내역에서 날짜를 탭하면 그날 기록도 수정할 수 있어요</div></div>
    <div class="dcard" id="att-edit-card" style="padding:14px 16px"></div>
    <div class="lbl" style="display:flex;align-items:center;justify-content:space-between;padding-right:20px">
      <span>📊 월별 근로시간 조회</span>
      <span style="display:flex;align-items:center;gap:8px">
        <button onclick="attChangeMonthM(-1)" style="border:none;background:var(--card);border-radius:6px;padding:2px 8px;cursor:pointer;color:var(--blue)">◀</button>
        <span id="att-month-label-m" style="font-size:12.5px;font-weight:700"></span>
        <button onclick="attChangeMonthM(1)" style="border:none;background:var(--card);border-radius:6px;padding:2px 8px;cursor:pointer;color:var(--blue)">▶</button>
      </span>
    </div>
    <div class="dcard" id="att-month-summary-m" style="padding:12px 16px">불러오는 중…</div>
    <div class="lbl">🗓 해당 월 상세 내역 · 탭해서 수정</div>
    <div class="dcard" id="att-recent-m" style="padding:6px 0">불러오는 중…</div>`;
  attUpdateMonthLabelM();
  await Promise.all([attLoadEditCardM(_attEditDateM), attLoadMonthSummaryM(), attLoadMonthRecordsM()]);
};
function bizDateKeyM(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function attUpdateMonthLabelM(){ const el=document.getElementById('att-month-label-m'); if(el) el.textContent=`${_attYearM}년 ${String(_attMonthM).padStart(2,'0')}월`; }
window.attChangeMonthM=async function(delta){
  _attMonthM+=delta;
  if(_attMonthM>12){_attMonthM=1;_attYearM++;} if(_attMonthM<1){_attMonthM=12;_attYearM--;}
  attUpdateMonthLabelM();
  await Promise.all([attLoadMonthSummaryM(),attLoadMonthRecordsM()]);
};
window.attSaveM=async function(){
  const checkIn=fv('att-checkin'),checkOut=fv('att-checkout'),breakMinutes=parseFloat(fv('att-break'))||0;
  if(!checkIn||!checkOut){alert('출근/퇴근 시간을 모두 입력해주세요.');return;}
  const workHours=attCalcWorkHoursM(checkIn,checkOut,breakMinutes);
  const dk=_attEditDateM||bizDateKeyM(), key=`${_myWorkerId}_${dk}`;
  const statusEl=document.getElementById('att-save-status-m');
  try{
    await setDoc(doc(db,'worker_attendance_log',key),{
      workerId:_myWorkerId,name:_me.name||'',rank:_me.rank||'',date:dk,yearMonth:dk.slice(0,7),
      checkIn,checkOut,breakMinutes,workHours,updatedAt:serverTimestamp()
    },{merge:true});
    if(statusEl){ statusEl.textContent='✓ 저장 완료'; statusEl.style.color='#16A34A'; }
    await Promise.all([attLoadMonthSummaryM(),attLoadMonthRecordsM()]);
  }catch(e){ if(statusEl){ statusEl.textContent='저장 실패: '+e.message; statusEl.style.color='#DC2626'; } }
};
async function attLoadMonthSummaryM(){
  const box=document.getElementById('att-month-summary-m'); if(!box) return;
  const ym=_attYearM+'-'+String(_attMonthM).padStart(2,'0');
  try{
    const snap=await getDocs(query(collection(db,'worker_attendance_log'),where('workerId','==',_myWorkerId),where('yearMonth','==',ym)));
    let attHours=0; snap.forEach(s=>{ attHours+=Number(s.data().workHours)||0; });
    const leaveHours=computeLeaveHoursForMonthM(_attYearM,_attMonthM);
    const total=attHours+leaveHours;
    const standard=edocMonthlyStandardHoursM(_attYearM,_attMonthM), maxOt=edocMonthlyMaxOvertimeHoursM(_attYearM,_attMonthM);
    const regularUsed=Math.min(total,standard), otUsed=Math.max(0,total-standard);
    const regularRemain=Math.max(0,standard-regularUsed), otRemain=Math.max(0,maxOt-otUsed);
    const row=(k,v,color)=>`<div class="drow"><span class="dk">${k}</span><span class="dv" style="${color?'color:'+color:''}">${v}</span></div>`;
    box.innerHTML=row(ym+' 소정근로시간',standard.toFixed(1)+'h')+row('최대초과근로 한도',maxOt.toFixed(1)+'h')
      +row('출퇴근 기록 근무시간',attHours.toFixed(1)+'h')+row('유급휴가 반영시간',leaveHours.toFixed(1)+'h')
      +row('해당 월 근무시간 누계',total.toFixed(1)+'h','#1D5BA6')+row('정규근로 잔여',regularRemain.toFixed(1)+'h','#16A34A')
      +row('초과근로 가능 잔여',otRemain.toFixed(1)+'h',otUsed>maxOt?'#DC2626':'#16A34A');
  }catch(e){ box.innerHTML=`<div style="color:#DC2626;padding:8px">불러오기 실패: ${esc(e.message)}</div>`; }
}
async function attLoadMonthRecordsM(){
  const box=document.getElementById('att-recent-m'); if(!box) return;
  const ym=_attYearM+'-'+String(_attMonthM).padStart(2,'0');
  try{
    const snap=await getDocs(query(collection(db,'worker_attendance_log'),where('workerId','==',_myWorkerId),where('yearMonth','==',ym)));
    let rows=[]; snap.forEach(s=>rows.push(s.data()));
    rows.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    if(!rows.length){ box.innerHTML='<div style="text-align:center;color:#9aa8bc;padding:16px 0">해당 월 기록이 없습니다</div>'; return; }
    box.innerHTML=rows.map(r=>`<div class="drow" onclick="attPickDayM('${r.date}')" style="cursor:pointer;${r.date===_attEditDateM?'background:#EEF4FC':''}"><span class="dk">${esc(r.date||'—')}</span><span class="dv">${esc(r.checkIn||'—')}~${esc(r.checkOut||'—')} · ${(r.workHours||0).toFixed(1)}h</span></div>`).join('')
      +`<div class="drow" style="font-weight:800;color:var(--blue)"><span class="dk">합계 (${rows.length}일)</span><span class="dv">${rows.reduce((s,r)=>s+(r.workHours||0),0).toFixed(1)}h</span></div>`;
  }catch(e){ box.innerHTML=`<div style="color:#DC2626;padding:8px">불러오기 실패: ${esc(e.message)}</div>`; }
}
function sub(coll,setter){
  const myUid=_me.uid||'';
  let byAuthor=[], byViewer=[], byAdmin=[], byPosted=[];
  const merge=()=>{
    const map={};
    [...byAuthor,...byViewer,...byAdmin,...byPosted].forEach(d=>{ map[d.id]=d; });
    setter(Object.values(map)); render();
  };
  const onErr=err=>{ loadError=err.code||err.message; render(); };
  if(myUid){
    onSnapshot(query(collection(db,coll), where('authorUid','==',myUid)), snap=>{ byAuthor=snap.docs.map(d=>({id:d.id,...d.data()})); merge(); }, onErr);
    onSnapshot(query(collection(db,coll), where('viewerUids','array-contains',myUid)), snap=>{ byViewer=snap.docs.map(d=>({id:d.id,...d.data()})); merge(); }, onErr);
  }
  if(_me.admin){
    onSnapshot(collection(db,coll), snap=>{ byAdmin=snap.docs.map(d=>({id:d.id,...d.data()})); merge(); }, onErr);
  } else {
    // PC(fetchEdocDocs)와 동일하게, 게시(posted) 확정된 문서는 관리자가 아니어도 전 직원이 볼 수 있어야 함(연차 달력 등)
    onSnapshot(query(collection(db,coll), where('status','==','posted')), snap=>{ byPosted=snap.docs.map(d=>({id:d.id,...d.data()})); merge(); }, onErr);
  }
}
let _authBooted=false;
onAuthStateChanged(auth, (user)=>{
  if(_authBooted) return; _authBooted=true;
  sub('edoc_daily',a=>{dailies=a;});
  sub('edoc_leave',a=>{leaves=a;});
  sub('edoc_purchase',a=>{purchases=a;});
  sub('edoc_expense',a=>{expenses=a;});
  sub('edoc_resign',a=>{resigns=a;});
  sub('edoc_cert',a=>{certs=a;});
  loadMyWorkerIdM(user);

  history.replaceState({v:'home',id:null},'');
  render();
});
