<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Microsoft 로그인 시험 — JH Portal</title>
<style>
:root { color-scheme: light dark; --bg:#F4F7FB; --ink:#16202f; --ink2:#52627a; --card:#ffffff; --line:#d8e0ec; --ok:#0f7a3d; --warn:#9a6700; --bad:#b42318; --btn:#2457c5; --btn-ink:#fff; }
@media (prefers-color-scheme: dark) { :root { --bg:#0F1623; --ink:#e8eef9; --ink2:#9fb0c9; --card:#172033; --line:#2a3750; --ok:#4cc38a; --warn:#e3b341; --bad:#ff8a80; --btn:#5b8def; --btn-ink:#0b1220; } }
body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,"Malgun Gothic",sans-serif; }
main { max-width:560px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
h1 { font-size:18px; margin:0 0 4px; } .sub { color:var(--ink2); margin:0 0 16px; font-size:13px; }
.box { border:1px solid var(--line); border-left-width:5px; border-radius:8px; padding:10px 12px; margin:12px 0; } .box p { margin:6px 0 0; }
.box.ok { border-left-color:var(--ok); } .box.warn { border-left-color:var(--warn); } .box.bad { border-left-color:var(--bad); }
table { width:100%; border-collapse:collapse; margin:8px 0; font-size:14px; } th { text-align:left; color:var(--ink2); font-weight:600; padding:6px 8px 6px 0; width:38%; vertical-align:top; } td { padding:6px 0; word-break:break-all; }
tr + tr th, tr + tr td { border-top:1px solid var(--line); }
.note { color:var(--ink2); font-size:12.5px; } .bar { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
button { font:inherit; padding:10px 16px; border-radius:8px; border:1px solid var(--btn); background:var(--btn); color:var(--btn-ink); cursor:pointer; } #t-other { background:transparent; color:var(--btn); }
</style>
</head>
<body>
<main>
  <h1>Microsoft 로그인 시험</h1>
  <p class="sub">테섭 전용 점검 페이지 — 실제 로그인 화면과 별개이며 로그인 상태를 바꾸지 않습니다.</p>
  <div id="root"><p>불러오는 중…</p></div>
</main>
<script type="module">
import { mountTestPage } from './core/ms-login-test.js?v=20261026o';
mountTestPage(document.getElementById('root')).catch((e) => { document.getElementById('root').innerHTML = '<div class="box bad"><strong>페이지를 시작하지 못했습니다</strong><p>' + String((e && e.message) || e).replace(/[<>&]/g, '') + '</p></div>'; });
</script>
</body>
</html>
